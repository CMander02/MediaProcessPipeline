<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b4ee4" />
    <title>MPP · 离线</title>
    <style>
      :root { color-scheme: light dark; font-family: "Noto Sans", system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
      main { width: min(28rem, calc(100vw - 3rem)); text-align: center; }
      img { width: 4rem; height: 4rem; }
      h1 { margin: 1rem 0 .5rem; font-size: 1.25rem; }
      p { margin: 0; color: color-mix(in srgb, CanvasText 62%, transparent); line-height: 1.7; }
      button { min-height: 44px; margin-top: 1.25rem; padding: 0 1rem; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: .5rem; background: Canvas; color: CanvasText; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>MPP 当前处于离线状态</h1>
      <p>应用界面已经保存在设备上。连接恢复后，即可继续读取归档和操作任务。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
