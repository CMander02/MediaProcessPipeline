name: Android APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/check-release-version.mjs
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('../pyproject.toml').read_text())['project']['version']
          tag = os.environ.get('RELEASE_TAG')
          if tag and tag != 'v' + version:
              raise SystemExit(f'Release tag {tag} must match v{version}')
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Prepare Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x android/gradlew
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MPP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Set MPP_ANDROID_KEYSTORE_BASE64 before building a release.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mpp-release.jks"
      - name: Build and verify signed APK
        env:
          MPP_ANDROID_KEYSTORE: ${{ runner.temp }}/mpp-release.jks
          MPP_ANDROID_STORE_PASSWORD: ${{ secrets.MPP_ANDROID_STORE_PASSWORD }}
          MPP_ANDROID_KEY_ALIAS: ${{ secrets.MPP_ANDROID_KEY_ALIAS }}
          MPP_ANDROID_KEY_PASSWORD: ${{ secrets.MPP_ANDROID_KEY_PASSWORD }}
        run: |
          npm run android:sync
          node scripts/android-gradle.mjs testDebugUnitTest lintRelease assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk MPP-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: MPP-android
          path: web/MPP-android.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mpp-release.jks"

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MPP-android
      - name: Attach APK to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" MPP-android.apk
