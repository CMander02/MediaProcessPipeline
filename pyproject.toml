[project]
name = "MediaProcessPipeline"
version = "0.6.3"
description = "Omni-Media Processing Pipeline - Convert audio/video to structured knowledge"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.28.0",
    # AI - OpenAI-compatible API (直连各 provider)
    "openai>=1.50.0",
    "transformers>=4.45.0",
    "python-multipart>=0.0.21",
    "numpy>=1.26.0",
    # Deterministic Simplified/Traditional Chinese normalization for generated artifacts.
    "opencc>=1.4.0,<2",
    # Unified local ASR runtime. CUDA wheels installed by setup keep this version identity.
    "sherpa-onnx==1.13.4",
    # CLI
    "typer>=0.15.0",
    "rich>=13.0.0",
    "psutil>=6.0.0",
    "youtube-transcript-api>=1.2.4",
    "sqlite-vec>=0.1.6",
    # Media pipeline runtime dependencies
    "yt-dlp>=2026.3.17",
    "litellm>=1.83.14",
    "playwright>=1.60.0",
]

[project.scripts]
mpp = "app.cli:_entry"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
asr-api-vad = [
    # Silero ONNX VAD chunking for API ASR; ffmpeg chunking works without this.
    "onnxruntime>=1.16.1",
]
uvr = [
    # PyTorch GPU - CUDA 12.8 (cu128 索引)
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    # 音频处理 (UVR5 人声分离)
    "audio-separator[gpu]>=0.41.0",
    # CUDA 12 + cuDNN 9; newer Windows wheels target CUDA 13.
    "onnxruntime-gpu==1.22.0",
]
local-asr = [
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    # 说话人分离 / 声纹
    "pyannote-audio>=3.4.0,<4",
    "soundfile>=0.12.1",
    "numba>=0.61.2",
]
forced-alignment = [
    # Optional Safetensors postprocessor for asr_timestamp_mode=qwen_forced.
    "qwen-asr>=0.0.6",
]
diarization = [
    # 独立于 Python ASR 模型，可与 sherpa-onnx / API ASR 组合使用。
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    "pyannote-audio>=3.4.0,<4",
    "soundfile>=0.12.1",
    "numba>=0.61.2",
]
local-llm = [
    "torch~=2.8.0",
    "accelerate>=0.34.0",
]
hf-local-inference = [
    "torch~=2.8.0",
    "accelerate>=0.34.0",
]
local-models = [
    "torch~=2.8.0",
    "torchaudio~=2.8.0",
    # audio-separator[gpu] provides onnxruntime-gpu, which also includes the CPU provider.
    # Installing onnxruntime alongside it overwrites the shared Python module on Windows.
    "audio-separator[gpu]>=0.41.0",
    "onnxruntime-gpu==1.22.0",
    # Qwen3-ASR inference is handled by sherpa-onnx; qwen-asr supplies ForcedAligner only.
    "qwen-asr>=0.0.6",
    "pyannote-audio>=3.4.0,<4",
    "numba>=0.61.2",
    "accelerate>=0.34.0",
]

[tool.setuptools.packages.find]
where = ["backend"]   # look for packages under backend/
include = ["app*"]    # only include app and its subpackages

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ============================================================================
# UV 配置：强制使用 PyTorch CUDA 12.8 索引
# ============================================================================
# 4090 + CUDA 13.0 驱动向下兼容 CUDA 12.8
# torch~=2.8.0 满足 qwen-asr 和 pyannote-audio 要求
# ============================================================================

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
